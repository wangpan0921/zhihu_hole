week: 1
audience: 在职 MBA 管理者与业务负责人
items:
  - weekday: 0
    theme: 管理与领导力
    title: 授权不是把任务甩出去
    idea: 真正有效的授权，交付的是结果责任，而不是一串待办事项。
    example: 交代“把客户方案做完”容易反复返工；交代目标、边界、验收标准，团队才知道什么叫完成。
    method: 用五要素授权：结果、截止时间、边界、资源、检查点。
    template: “请你在【日期】前完成【结果】；不能改变【边界】；可调用【资源】；我们在【检查点】看【验收指标】。”
    metric: 验收标准必须能被第三方判断，最好包含数量、质量或时间中的至少一项。
    pitfall: 只说“你全权负责”，却不给决策边界，最后责任在下属、决策权在上级。
    action: 今天挑一项工作，用五要素重新说一遍，并让对方复述验收标准.
    question: 你最难授权的工作，卡在能力、信任，还是验收标准不清？
  - weekday: 1
    theme: 战略与商业模式
    title: 先问客户要完成什么任务
    idea: 客户买的通常不是产品本身，而是借它完成一件更重要的事。
    example: 用户买咖啡机，可能是在家稳定获得一杯好咖啡，也可能是在办公室体面地招待客户；两种任务对应不同产品和渠道。
    method: 用“情境-任务-障碍-替代方案-成功标准”五格访谈，不从“您喜欢哪些功能”开始。
    template: “上一次你遇到【情境】是什么时候？当时要完成什么任务？现在怎么解决？最不满意哪一步？”
    metric: 至少访谈 5 位同类客户；若三人以上主动描述同一障碍，才值得进入产品优先级。
    pitfall: 把客户提出的功能清单直接当需求，忽略他真正想改善的结果。
    action: 选一个核心客户，完成一次 15 分钟访谈并记录原话，不要先介绍自己的产品.
    question: 如果只保留一个客户使用场景，你的产品会留下哪一个？
  - weekday: 2
    theme: AI 与效率
    title: AI 最适合先做第一稿
    idea: 把 AI 当作可检查的初级同事，先让它扩展思路，再由人承担判断责任。
    example: 周报可以让 AI 先按“事实、风险、下周动作”整理，但数据口径、因果关系和敏感信息必须人工复核。
    method: 一个可复用提示词要写清角色、输入、输出格式、限制条件和示例。
    template: “你是【角色】。根据【输入】输出【格式】；只使用输入中的事实；不确定处标‘待核实’；先给结论，再列依据。”
    metric: 用 10 份历史样本盲测，记录准确率、人工修改分钟数和遗漏率，再决定是否上线。
    pitfall: 把含客户隐私、未公开财务数据或公司密钥的原文直接粘贴到公共模型。
    action: 给 AI 一项低风险重复工作，跑 10 份样本并记录人工修改时间，不凭一次惊艳结果决策.
    question: 你所在团队最值得先交给 AI 的重复工作是什么？
  - weekday: 3
    theme: 财务常识
    title: 利润增长不等于现金变多
    idea: 利润是经营结果，现金流是企业能否继续运转的氧气。
    example: 账面上签下大订单会增加收入和利润，但如果客户 90 天后才付款，而供应商 30 天就要收款，公司仍可能先陷入现金压力。
    method: 做一张 13 周现金滚动表，只记预计收款、预计付款和期末余额。
    template: “周次｜期初现金｜确定收款｜可能收款｜必须付款｜可延后付款｜期末现金”。
    metric: 重点盯“现金可覆盖周数”和应收账款逾期天数；低于安全线就提前融资或收款，而不是等账户见底。
    pitfall: 把合同金额当成现金，把利润表当成银行余额表。
    action: 看本月一笔大订单，填入 13 周表，写清收入确认日、客户付款日和供应商付款日.
    question: 你更常盯收入、利润，还是经营性现金流？为什么？
  - weekday: 4
    theme: 沟通与决策
    title: 反对方案，不要反对人
    idea: 高质量的分歧，应该让团队更早看见假设和代价，而不是让表达者丢面子。
    example: 与其说“这个方案不靠谱”，不如说“如果转化率只有预估的一半，预算和交付周期会怎样？”
    method: 用“共同目标-关键假设-反事实-验证动作”四步表达异议。
    template: “我们都要达成【目标】。这个方案依赖【假设】；如果【反事实】发生，结果会变成【代价】。建议用【低成本实验】在【时间】内验证。”
    metric: 每次争论最后必须落到一个负责人、一个验证动作和一个截止时间，否则只是观点对撞。
    pitfall: 用“大家都知道”“肯定不行”等无证据判断，迫使对方为自己辩护。
    action: 下次提出异议时，按四步写在会议纪要里，并补上验证负责人和日期.
    question: 你见过最有价值的一次“反对意见”是怎样表达的？
  - weekday: 5
    theme: 商业案例
    title: 会员制卖的不是折扣
    idea: Costco 等会员制零售的核心，不只是便宜，而是用会员费换取稳定复购和信任。
    example: 当顾客相信选品可靠、价格透明，且会员权益持续有感，他会减少比较成本并提高购买频率。
    method: 先算留存经济：单个客户年毛利 × 预期留存年数 - 获客成本 - 服务成本。
    template: “会员承诺【持续权益】；客户每月获得【可量化价值】；我们用【留存率/复购率】检验是否兑现。”
    metric: 不只看新增会员，至少同时看 30/90 天留存率、会员复购频次和权益使用率。
    pitfall: 先收会员费再慢慢想权益，导致首月很兴奋、三个月后大量退款或流失。
    action: 画出业务从获客到复购的链路，算一遍单客毛利和 90 天留存，找出一个真正可持续的权益.
    question: 你的产品有什么理由让客户愿意持续留下，而不只是再次被打折吸引？
  - weekday: 6
    theme: 复盘与成长
    title: 用一页纸结束一周
    idea: 复盘不是写总结，而是把经历变成下一周可以使用的判断规则。
    example: 与其记录“项目延期”，不如写成“涉及三方依赖的任务，必须在启动时锁定负责人和最晚确认时间”。
    method: 用“事实-影响-原因-规则-实验”五栏复盘，区分可控原因与外部噪声。
    template: “事实是【可观察证据】；造成【影响】；最可能原因是【假设】；以后当【触发条件】就执行【规则】。”
    metric: 每周只选一个实验，提前写成功阈值和停止条件，避免把复盘变成情绪记录。
    pitfall: 把“加强沟通”“提高效率”当结论，没有具体触发条件和动作。
    action: 用五栏复盘本周一件事，只选一个实验，写清下周何时、由谁、用什么指标验证.
    question: 本周哪件事最值得沉淀成一条团队规则？
