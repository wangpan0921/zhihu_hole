# 知乎树洞圈子自动发布系统配置

zhihu:
  # 树洞圈子地址
  ring_url: "https://www.zhihu.com/ring/host/1939123142221100709?tab=new&tab_id=0"
  # 登录态保存路径
  storage_state: "data/auth/storage_state.json"
  # 书籍池全部读完后，给"运营者本人"发提醒私信的目标用户主页 URL。
  # 形如 https://www.zhihu.com/people/<urlToken>。留空则跳过发私信。
  notify_people_url: "https://www.zhihu.com/people/one-31-9-97"

# 微信读书：用于抓取指定书的章节正文做"读书感悟"型内容
weread:
  # 登录态保存路径（终端二维码扫一次后长期复用）
  storage_state: "data/auth/weread_state.json"

# 文案生成
content:
  # 内容模式：themes（主题池随机）/ book_reflection（按书章节顺序写读书感悟）
  # book_reflection 失败时（如 index.json 缺失、章节摘要为空）会自动回退到 themes
  mode: "book_reflection"
  # provider: anthropic | openai (留空则按 .env 中已有的 key 自动选)
  provider: "openai"
  # anthropic 模型
  anthropic_model: "claude-sonnet-4-5-20250929"
  # openai 模型
  openai_model: "gpt-5.2"
  # 字数范围（知乎想法上限 ~1000 字）
  # themes 模式建议 180-380；book_reflection 100-500，宁可短也不凑字数
  min_chars: 100
  max_chars: 500

  # book_reflection 模式专用配置
  book:
    # 【书籍池】按顺序逐本读完。每个元素是一本书的 bookId
    # （用 scripts/weread_index_book.py 索引完一本书后看 index.json 所在目录名）。
    # 发布时从池子第一本还没读完的书里挑下一章；一本读完自动进入下一本；
    # 池子里所有书都读完后，会给 zhihu.notify_people_url 发一条提醒私信，
    # 并自动回退到 themes 主题池模式继续产出内容。
    book_pool:
      - "3300199477"   # 《中年破局：别信什么35岁危机（轻纪实）》张峻滔
      - "3300194835"   # 《停止自我攻击》周小宽
      - "3300200209"   # 《半小时讲透第一性原理（轻思维）》樊中恺
      - "33628204"     # 《认知觉醒：开启自我改变的原动力》周岭
      - "30887804"     # 《故事力》高琳 林宏博
      - "40425664"     # 《高敏感是种天赋（套装共3册）》[丹]伊尔斯·桑德
    # 书籍池全部读完时发的私信内容（留空用默认提醒文案）
    finish_message: ""
    # （向后兼容）只读一本书时也可以只配 book_id，不配 book_pool：
    # book_id: "3300199477"
    # 跳过这些 chapterUid（除了自动跳过非正文章节外，再额外排除）
    skip_chapter_uids: []
    # 章节最小字数（小于此字数的章节视为非正文跳过，默认 800）
    min_word_count: 800

  # themes 模式的主题池：每次随机抽一个
  # 尽量用「具体场景/常见情绪触发点」而不是抽象大词，写出来才不会飘。
  themes:
    - "深夜刷手机停不下来，其实在逃避什么"
    - "一个人吃饭、一个人看电影，不是可怜，是一种能力"
    - "犯了个小错就反复自责到半夜，图什么"
    - "todo list 越写越长，越写越焦虑"
    - "总在猜别人是不是在说自己"
    - "情绪上来的那几分钟，脑子会突然变笨"
    - "微信消息不回会心慌，回了又觉得敷衍"
    - "习惯性道歉，哪怕不是自己的错"
    - "对未来的计划总在变，是不是不够坚定"
    - "把别人的评价活成了自己的KPI"
    - "断舍离扔了一堆东西，心里还是乱"
    - "每天坚持一件小事，比立宏愿更管用"
    - "在别人面前不敢示弱，累的是自己"
    - "总把最坏的结果先想一遍，才敢往前走"
    - "过去的一天就这样过去了，好像什么都没留下"

# 配图
image:
  # 优先级：unsplash → openai（内部网关不出图，先走 Unsplash）
  prefer: "unsplash"
  openai_model: "dall-e-3"   # gpt-image-1 也可
  size: "1024x1024"
  style: "ethereal, peaceful, minimalist, soft natural light, dreamy atmosphere, no text, no people"

# 文章 → 专栏 发布配置（独立于上面的圈子想法链路）
# 每天 19:00 cron 触发 scripts/publish_articles.py：
#   - 扫 docs/pending/ 下的 .md，挑 mtime 最早的一篇
#   - 发布到下面 column_name 指定的专栏
#   - 成功后写 {stem}.meta.json，作为知乎已发标记
#   - 仅当公众号 {stem}.wechat.meta.json 也存在时，才把 md 移到 docs/published/
#   - 目录为空或 pending 文件都已有知乎标记就什么都不做
article:
  # 发布弹窗里要选的目标专栏名（按字面文本匹配）
  column_name: "Agent工坊"

# 微信公众号合集 → 独立知乎专栏。每天 08:30 只发布下一篇。
wechat_album_to_zhihu:
  album_url: "https://mp.weixin.qq.com/mp/appmsgalbum?__biz=MzY5MDM1OTU3Mg==&action=getalbum&album_id=4594165319145046019#wechat_redirect"
  column_name: "跟着史蒂夫学编程"
  skip_first: 1
  state_path: "data/wechat_album/state.json"

# 微信公众号发布配置
# 每天 08:00 cron 触发 scripts/publish_wechat_articles.py：
#   - 扫 docs/pending/ 下的 .md，挑 mtime 最早的一篇
#   - 使用公众号友好的 HTML 模板粘贴到图文编辑器
#   - 成功后写 {stem}.wechat.meta.json，作为公众号已发标记
#   - 仅当知乎 {stem}.meta.json 也存在时，才把 md 移到 docs/published/
#   - 目录为空或 pending 文件都已有公众号标记就什么都不做
wechat_mp:
  # 运行 scripts/wechat_login.py 扫码后保存的微信公众号后台登录态
  storage_state: "data/auth/wechat_mp_state.json"
  # 新建图文链接；可保留 issue 中给出的链接，token 过期时脚本会从首页 URL 尝试补新 token
  edit_url: "https://mp.weixin.qq.com/cgi-bin/appmsg?t=media/appmsg_edit_v2&action=edit&isNew=1&type=10&token=606650881&lang=zh_CN&timestamp=1782829732579"
  # publish：尝试点击发表/发布/群发；draft：只保存为草稿
  publish_action: "publish"

# 发布调度
schedule:
  # 每天发布时刻（24h），cron 会按这些点触发
  slots:
    - { name: "morning", hour: 7,  minute: 0 }
    - { name: "evening", hour: 18, minute: 0 }
  # 每天预生成草稿到 pending/ 的时刻（生成的是「明天」的草稿，留出审核时间）
  pre_generate:
    hour: 19
    minute: 0
  # 发布时若 pending/ 没有当前 slot 的草稿是否现生现发
  fallback_realtime: true
