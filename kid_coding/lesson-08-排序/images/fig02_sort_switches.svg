<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.05"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "Noto Sans CJK SC", "DejaVu Sans", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; }
    .dash { stroke-dasharray: 10 8; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="600" y="30" font-size="40" fill="#111827" text-anchor="middle">Python 排序 · 四个开关</text>
<rect class="shape" x="80" y="112" width="500" height="218" rx="15" fill="#e7f5ff" stroke="#1971c2" stroke-width="4"/>
<text class="code" x="330" y="137" font-size="34" fill="#1971c2" text-anchor="middle">.sort()</text>
<text class="code" x="330" y="194" font-size="35" fill="#1971c2" text-anchor="middle">↻</text>
<text class="" x="330" y="244" font-size="23" fill="#111827" text-anchor="middle">原地改列表，没返回值</text>
<rect class="shape" x="180" y="284" width="300" height="34" rx="7" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text class="code" x="330" y="290" font-size="17" fill="#111827" text-anchor="middle">loot.sort()</text>
<rect class="shape" x="620" y="112" width="500" height="218" rx="15" fill="#fff4cc" stroke="#f08c00" stroke-width="4"/>
<text class="code" x="870" y="137" font-size="34" fill="#f08c00" text-anchor="middle">sorted(...) </text>
<text class="code" x="870" y="194" font-size="35" fill="#f08c00" text-anchor="middle">▣ → ▣</text>
<text class="" x="870" y="244" font-size="23" fill="#111827" text-anchor="middle">返回新列表，原列表不动</text>
<rect class="shape" x="720" y="284" width="300" height="34" rx="7" fill="#ffffff" stroke="#f08c00" stroke-width="2"/>
<text class="code" x="870" y="290" font-size="17" fill="#111827" text-anchor="middle">new = sorted(loot)</text>
<rect class="shape" x="80" y="370" width="500" height="218" rx="15" fill="#e6fcf5" stroke="#0ca678" stroke-width="4"/>
<text class="code" x="330" y="395" font-size="34" fill="#0ca678" text-anchor="middle">reverse=True</text>
<text class="code" x="330" y="452" font-size="35" fill="#0ca678" text-anchor="middle">↓  ↑</text>
<text class="" x="330" y="502" font-size="23" fill="#111827" text-anchor="middle">从大到小</text>
<rect class="shape" x="180" y="542" width="300" height="34" rx="7" fill="#ffffff" stroke="#0ca678" stroke-width="2"/>
<text class="code" x="330" y="548" font-size="17" fill="#111827" text-anchor="middle">sort(reverse=True)</text>
<rect class="shape" x="620" y="370" width="500" height="218" rx="15" fill="#f3f0ff" stroke="#7048e8" stroke-width="4"/>
<text class="code" x="870" y="395" font-size="34" fill="#7048e8" text-anchor="middle">key=函数</text>
<text class="code" x="870" y="452" font-size="35" fill="#7048e8" text-anchor="middle">1 ┃ 2 ┃ 3</text>
<text class="" x="870" y="502" font-size="23" fill="#111827" text-anchor="middle">按什么标准比较</text>
<rect class="shape" x="720" y="542" width="300" height="34" rx="7" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
<text class="code" x="870" y="548" font-size="17" fill="#111827" text-anchor="middle">sort(key=len)</text>
<text class="" x="600" y="625" font-size="24" fill="#495057" text-anchor="middle">改自己 / 拷贝改 · 方向 · 比较标准</text>
  </g>
</svg>
