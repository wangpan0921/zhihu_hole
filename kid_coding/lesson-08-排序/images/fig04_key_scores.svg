    .code { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; }
    .dash { stroke-dasharray: 10 8; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
