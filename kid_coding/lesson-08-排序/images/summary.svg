<text class="" x="65" y="98" font-size="56" fill="#ffffff" text-anchor="start">排序</text>
<text class="" x="835" y="132" font-size="22" fill="#cbd5e1" text-anchor="end">《我的世界里学编程》</text>
<rect class="shape" x="65" y="225" width="770" height="100" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<ellipse class="shape" cx="118" cy="275" rx="29" ry="29" fill="#1971c2" stroke="#1971c2" stroke-width="2"/>
<text class="code" x="118" y="259" font-size="18" fill="#ffffff" text-anchor="middle">01</text>
<text class="code" x="170" y="243" font-size="28" fill="#111827" text-anchor="start">.sort()</text>
<text class="" x="170" y="283" font-size="23" fill="#495057" text-anchor="start">原地排，没有返回值</text>
