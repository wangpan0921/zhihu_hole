<text class="code" x="118" y="391" font-size="18" fill="#ffffff" text-anchor="middle">02</text>
<text class="code" x="170" y="375" font-size="28" fill="#111827" text-anchor="start">sorted()</text>
<text class="" x="170" y="415" font-size="23" fill="#495057" text-anchor="start">拷一份排，返回新列表</text>
<rect class="shape" x="65" y="489" width="770" height="100" rx="10" fill="#ffffff" stroke="#0ca678" stroke-width="3"/>
