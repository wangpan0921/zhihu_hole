<text class="code" x="170" y="771" font-size="28" fill="#111827" text-anchor="start">列表套列表</text>
<text class="" x="170" y="811" font-size="23" fill="#495057" text-anchor="start">bag[i][j] 取一格信息</text>
<rect class="shape" x="65" y="885" width="770" height="100" rx="10" fill="#ffffff" stroke="#e03131" stroke-width="3"/>
<ellipse class="shape" cx="118" cy="935" rx="29" ry="29" fill="#e03131" stroke="#e03131" stroke-width="2"/>
