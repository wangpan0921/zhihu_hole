<text class="code" x="170" y="639" font-size="28" fill="#111827" text-anchor="start">key=函数</text>
<text class="" x="170" y="679" font-size="23" fill="#495057" text-anchor="start">按什么标准比较</text>
<rect class="shape" x="65" y="753" width="770" height="100" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<ellipse class="shape" cx="118" cy="803" rx="29" ry="29" fill="#1971c2" stroke="#1971c2" stroke-width="2"/>
