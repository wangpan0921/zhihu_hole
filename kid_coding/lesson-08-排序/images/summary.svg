<text class="code" x="170" y="903" font-size="28" fill="#111827" text-anchor="start">稳定排序</text>
<text class="" x="170" y="943" font-size="23" fill="#495057" text-anchor="start">平手时保持原顺序</text>
<rect x="0" y="1085" width="900" height="115" fill="#111827"/>
<text class="" x="65" y="1117" font-size="29" fill="#ffffff" text-anchor="start">少儿编程 · Python 入门</text>
