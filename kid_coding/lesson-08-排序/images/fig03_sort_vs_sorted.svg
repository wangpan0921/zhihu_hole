<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.05"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "Noto Sans CJK SC", "DejaVu Sans", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; }
    .dash { stroke-dasharray: 10 8; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="600" y="24" font-size="34" fill="#111827" text-anchor="middle">.sort() vs sorted() —— 一个动手改，一个拷贝改</text>
<line class="" x1="600" y1="88" x2="600" y2="555" stroke="#dee2e6" stroke-width="3"/>
<text class="code" x="300" y="91" font-size="29" fill="#1971c2" text-anchor="middle">.sort() —— 原地改</text>
<text class="code" x="900" y="91" font-size="29" fill="#f08c00" text-anchor="middle">sorted(...) —— 拷贝改</text>
<rect class="shape" x="75" y="140" width="450" height="62" rx="9" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
<text class="code" x="300" y="157" font-size="23" fill="#0b4f7a" text-anchor="middle">loot.sort()</text>
<rect class="shape" x="675" y="140" width="450" height="62" rx="9" fill="#fff4cc" stroke="#f08c00" stroke-width="3"/>
<text class="code" x="900" y="157" font-size="21" fill="#7c2d12" text-anchor="middle">new_loot = sorted(loot)</text>
<rect class="shape" x="110" y="250" width="380" height="105" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="4"/>
<text class="" x="140" y="264" font-size="20" fill="#0b4f7a" text-anchor="start">loot 箱子</text>
<text class="code" x="300" y="309" font-size="22" fill="#111827" text-anchor="middle">[3, 12, 1, 8, 5]</text>
<line class="" x1="300" y1="362" x2="300" y2="410" stroke="#1971c2" stroke-width="5" marker-end="url(#arrow-blue)"/>
<text class="" x="325" y="376" font-size="19" fill="#1971c2" text-anchor="start">就地重排</text>
<rect class="shape" x="110" y="420" width="380" height="92" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/>
<text class="" x="140" y="432" font-size="19" fill="#0b4f7a" text-anchor="start">loot 变成</text>
<text class="code" x="300" y="466" font-size="22" fill="#111827" text-anchor="middle">[1, 3, 5, 8, 12]</text>
<text class="" x="300" y="530" font-size="20" fill="#e03131" text-anchor="middle">⚠ 接住返回值只会得到 None</text>
<rect class="shape" x="630" y="254" width="215" height="94" rx="10" fill="#fff4cc" stroke="#f08c00" stroke-width="3"/>
<text class="" x="650" y="266" font-size="18" fill="#7c2d12" text-anchor="start">loot 原样</text>
<text class="code" x="738" y="305" font-size="16" fill="#111827" text-anchor="middle">[3,12,1,8,5]</text>
<rect class="shape" x="882" y="260" width="95" height="80" rx="7" fill="#f1f3f5" stroke="#495057" stroke-width="4"/>
<text class="" x="930" y="274" font-size="20" fill="#111827" text-anchor="middle">复制</text>
<text class="code" x="930" y="307" font-size="15" fill="#495057" text-anchor="middle">SORT</text>
<line class="" x1="845" y1="301" x2="880" y2="301" stroke="#f08c00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<rect class="shape" x="1015" y="254" width="150" height="94" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="3"/>
<text class="code" x="1090" y="264" font-size="17" fill="#087f5b" text-anchor="middle">new_loot</text>
<text class="code" x="1090" y="305" font-size="14" fill="#111827" text-anchor="middle">[1,3,5,8,12]</text>
<line class="" x1="977" y1="301" x2="1012" y2="301" stroke="#0ca678" stroke-width="4" marker-end="url(#arrow-green)"/>
<text class="" x="738" y="383" font-size="22" fill="#0ca678" text-anchor="middle">✓ 原列表不变</text>
<text class="" x="1040" y="383" font-size="22" fill="#0ca678" text-anchor="middle">✓ 新列表接住结果</text>
<rect class="shape" x="675" y="430" width="450" height="75" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="3"/>
<text class="" x="900" y="450" font-size="23" fill="#087f5b" text-anchor="middle">有返回值，必须用变量接住</text>
<text class="" x="600" y="590" font-size="23" fill="#495057" text-anchor="middle">选原地用 .sort()；想保留原列表用 sorted()。返回值不接就白忙。</text>
  </g>
</svg>
