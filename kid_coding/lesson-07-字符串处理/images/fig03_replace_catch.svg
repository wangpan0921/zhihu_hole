<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.05"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "Noto Sans CJK SC", "DejaVu Sans", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; }
    .dash { stroke-dasharray: 10 8; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="600" y="28" font-size="34" fill="#111827" text-anchor="middle">.replace 不会改原字符串，必须用变量接住返回值</text>
<line class="shape" x1="600" y1="95" x2="600" y2="555" stroke="#dee2e6" stroke-width="3"/>
<text class="" x="300" y="95" font-size="32" fill="#e03131" text-anchor="middle">✕  白改</text>
<text class="" x="900" y="95" font-size="32" fill="#0ca678" text-anchor="middle">✓  接住了</text>
<rect class="shape" x="75" y="150" width="450" height="64" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text class="code" x="300" y="168" font-size="23" fill="#c92a2a" text-anchor="middle">msg.replace("笨蛋", "**")</text>
<rect class="shape" x="675" y="150" width="450" height="64" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="3"/>
<text class="code" x="900" y="168" font-size="22" fill="#087f5b" text-anchor="middle">msg = msg.replace("笨蛋", "**")</text>
<rect class="shape" x="175" y="255" width="250" height="130" rx="14" fill="#495057" stroke="#212529" stroke-width="4"/>
<text class="" x="300" y="276" font-size="25" fill="#ffffff" text-anchor="middle">replace 机器</text>
<text class="code" x="300" y="325" font-size="21" fill="#d1fae5" text-anchor="middle">"笨蛋" → "**"</text>
<line class="shape" x1="125" y1="320" x2="175" y2="320" stroke="#1971c2" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text class="" x="25" y="276" font-size="19" fill="#0b4f7a" text-anchor="start">msg 箱子</text>
<rect class="shape" x="15" y="305" width="110" height="70" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
<text class="" x="70" y="320" font-size="16" fill="#111827" text-anchor="middle">笨蛋苦力怕</text>
<line class="shape" x1="425" y1="320" x2="495" y2="320" stroke="#e03131" stroke-width="4" marker-end="url(#arrow-red)"/>
<rect class="shape" x="775" y="255" width="250" height="130" rx="14" fill="#495057" stroke="#212529" stroke-width="4"/>
<text class="" x="900" y="276" font-size="25" fill="#ffffff" text-anchor="middle">replace 机器</text>
<text class="code" x="900" y="325" font-size="21" fill="#d1fae5" text-anchor="middle">"笨蛋" → "**"</text>
<line class="shape" x1="725" y1="320" x2="775" y2="320" stroke="#1971c2" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text class="" x="625" y="276" font-size="19" fill="#0b4f7a" text-anchor="start">msg 箱子</text>
<rect class="shape" x="615" y="305" width="110" height="70" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
<text class="" x="670" y="320" font-size="16" fill="#111827" text-anchor="middle">笨蛋苦力怕</text>
<line class="shape" x1="1025" y1="320" x2="1050" y2="320" stroke="#0ca678" stroke-width="4" marker-end="url(#arrow-green)"/>
<text class="code" x="470" y="415" font-size="22" fill="#c92a2a" text-anchor="middle">"**苦力怕"</text>
<line class="shape" x1="470" y1="445" x2="470" y2="500" stroke="#e03131" stroke-width="4" marker-end="url(#arrow-red)"/>
<text class="" x="470" y="518" font-size="20" fill="#c92a2a" text-anchor="middle">掉地上，msg 还是原样</text>
<rect class="shape" x="1030" y="405" width="120" height="86" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="3"/>
<text class="code" x="1090" y="415" font-size="18" fill="#087f5b" text-anchor="middle">msg =</text>
<text class="code" x="1090" y="450" font-size="15" fill="#111827" text-anchor="middle">"**苦力怕"</text>
<text class="" x="600" y="595" font-size="25" fill="#495057" text-anchor="middle">就像上一课的 return——不接住，成品就掉地上</text>
  </g>
</svg>
