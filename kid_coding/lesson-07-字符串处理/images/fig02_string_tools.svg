<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.05"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "Noto Sans CJK SC", "DejaVu Sans", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; }
    .dash { stroke-dasharray: 10 8; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="600" y="36" font-size="40" fill="#111827" text-anchor="middle">字符串处理三把小工具</text>
<rect class="shape" x="85" y="120" width="350" height="440" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="4"/>
<text class="code" x="260" y="150" font-size="42" fill="#1971c2" text-anchor="middle">in</text>
<ellipse class="shape" cx="260" cy="260" rx="58" ry="58" fill="#ffffff" stroke="#1971c2" stroke-width="5"/>
<line class="shape" x1="300" y1="303" x2="350" y2="353" stroke="#1971c2" stroke-width="12"/>
<text class="" x="260" y="242" font-size="31" fill="#1971c2" text-anchor="middle">词</text>
<text class="" x="260" y="385" font-size="27" fill="#111827" text-anchor="middle">查有没有</text>
<text class="" x="260" y="424" font-size="23" fill="#1971c2" text-anchor="middle">→ True / False</text>
<rect class="shape" x="113" y="486" width="294" height="48" rx="8" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text class="code" x="260" y="497" font-size="18" fill="#111827" text-anchor="middle">"笨蛋" in msg</text>
<rect class="shape" x="425" y="120" width="350" height="440" rx="16" fill="#fff4cc" stroke="#f08c00" stroke-width="4"/>
<text class="code" x="600" y="150" font-size="42" fill="#f08c00" text-anchor="middle">.replace</text>
<line class="shape" x1="505" y1="265" x2="695" y2="265" stroke="#f08c00" stroke-width="5" marker-end="url(#arrow-orange)"/>
<line class="shape" x1="695" y1="325" x2="505" y2="325" stroke="#f08c00" stroke-width="5" marker-end="url(#arrow-orange)"/>
<text class="" x="600" y="278" font-size="27" fill="#f08c00" text-anchor="middle">旧 ↔ 新</text>
<text class="" x="600" y="385" font-size="27" fill="#111827" text-anchor="middle">把旧的换成新的</text>
<text class="" x="600" y="424" font-size="23" fill="#f08c00" text-anchor="middle">要用变量接住！</text>
<rect class="shape" x="453" y="486" width="294" height="48" rx="8" fill="#ffffff" stroke="#f08c00" stroke-width="2"/>
<text class="code" x="600" y="497" font-size="18" fill="#111827" text-anchor="middle">msg.replace("笨蛋", "**")</text>
<rect class="shape" x="765" y="120" width="350" height="440" rx="16" fill="#e6fcf5" stroke="#0ca678" stroke-width="4"/>
<text class="code" x="940" y="150" font-size="42" fill="#0ca678" text-anchor="middle">[起:终]</text>
<text class="" x="940" y="235" font-size="85" fill="#0ca678" text-anchor="middle">✂</text>
<line class="shape dash" x1="835" y1="335" x2="1045" y2="335" stroke="#0ca678" stroke-width="4"/>
<text class="" x="940" y="385" font-size="27" fill="#111827" text-anchor="middle">切出连续一小段</text>
<text class="" x="940" y="424" font-size="23" fill="#0ca678" text-anchor="middle">含头不含尾</text>
<rect class="shape" x="793" y="486" width="294" height="48" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="2"/>
<text class="code" x="940" y="497" font-size="18" fill="#111827" text-anchor="middle">msg[0:3]</text>
<text class="" x="600" y="600" font-size="28" fill="#495057" text-anchor="middle">先找 → 再换 → 最后切出需要的部分</text>
  </g>
</svg>
