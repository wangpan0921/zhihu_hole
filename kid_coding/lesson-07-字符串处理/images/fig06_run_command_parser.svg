<rect width="1200" height="675" fill="#f4f6fb"/>
<rect class="shape" x="55" y="48" width="1090" height="580" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="55" y="48" width="1090" height="50" fill="#f1f3f5" rx="8"/>
<circle cx="82" cy="73" r="7" fill="#ff5f57"/><circle cx="105" cy="73" r="7" fill="#febc2e"/><circle cx="128" cy="73" r="7" fill="#28c840"/>
<text class="" x="160" y="61" font-size="23" fill="#111827" text-anchor="start">第 7 课：命令识别机</text>
<rect class="shape" x="80" y="120" width="670" height="475" rx="6" fill="#f8fafc" stroke="#d0d7de" stroke-width="2"/>
<text class="" x="105" y="140" font-size="20" fill="#495057" text-anchor="start">main.py</text>
<text class="code" x="105" y="184" font-size="16" fill="#111827" text-anchor="start">def parse_command(msg):</text>
<text class="code" x="105" y="205.28" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;if msg[:1] != "/":</text>
<text class="code" x="105" y="226.56" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;return "这是普通聊天：" + msg</text>
<text class="code" x="105" y="247.84" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;space = msg.find(" ")</text>
<text class="code" x="105" y="269.12" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;if space == -1:</text>
<text class="code" x="105" y="290.4" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;return "命令：" + msg[1:] + "（没有参数）"</text>
<text class="code" x="105" y="311.68" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;action = msg[1:space]</text>
<text class="code" x="105" y="332.96000000000004" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;args = msg[space+1:]</text>
<text class="code" x="105" y="354.24" font-size="16" fill="#111827" text-anchor="start">&#160;&#160;&#160;&#160;return "命令=" + action + "，参数=" + args</text>
<text class="code" x="105" y="375.52" font-size="16" fill="#111827" text-anchor="start"></text>
<text class="code" x="105" y="396.8" font-size="16" fill="#111827" text-anchor="start">print(parse_command("你好呀"))</text>
<text class="code" x="105" y="418.08000000000004" font-size="16" fill="#111827" text-anchor="start">print(parse_command("/help"))</text>
<text class="code" x="105" y="439.36" font-size="16" fill="#111827" text-anchor="start">print(parse_command("/give diamond"))</text>
<rect class="shape" x="780" y="120" width="335" height="475" rx="6" fill="#f8fafc" stroke="#d0d7de" stroke-width="2"/>
<text class="" x="805" y="140" font-size="20" fill="#495057" text-anchor="start">运行结果</text>
<line class="shape" x1="805" y1="176" x2="1090" y2="176" stroke="#d0d7de" stroke-width="2"/>
<text class="code" x="805" y="205" font-size="17" fill="#087f5b" text-anchor="start">这是普通聊天：你好呀</text>
<text class="code" x="805" y="230.16" font-size="17" fill="#087f5b" text-anchor="start">命令：help（没有参数）</text>
<text class="code" x="805" y="255.32" font-size="17" fill="#087f5b" text-anchor="start">命令=give，参数=diamond</text>
<text class="code" x="805" y="548" font-size="14" fill="#087f5b" text-anchor="start">Process finished with exit code 0</text>
