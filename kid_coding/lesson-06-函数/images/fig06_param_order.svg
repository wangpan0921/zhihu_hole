<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7048e8"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", "Noto Sans CJK SC", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="140" y="30" font-size="32" fill="#111827" text-anchor="start">参数按位置对号入座 —— 顺序一换，成品就变</text>
<text class="code" x="90" y="95" font-size="24" fill="#0b4f7a" text-anchor="start">make_potion("苦力怕的眼泪", "糖")</text>
<rect class="shape" x="500" y="140" width="260" height="130" rx="12" fill="#495057" stroke="#212529" stroke-width="4"/>
<text class="" x="530" y="195" font-size="20" fill="#f8fafc" text-anchor="start">make_potion</text>
<rect class="shape" x="415" y="148" width="95" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text class="" x="428" y="156" font-size="18" fill="#0b4f7a" text-anchor="start">main</text>
<rect class="shape" x="415" y="210" width="95" height="36" rx="6" fill="#fff4cc" stroke="#f08c00" stroke-width="2"/>
<text class="" x="428" y="218" font-size="18" fill="#b35c00" text-anchor="start">extra</text>
<line class="shape" x1="260" y1="100" x2="420" y2="163" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
<line class="shape" x1="200" y1="100" x2="420" y2="225" stroke="#f08c00" stroke-width="3" marker-end="url(#arrow-orange)"/>
<line class="shape" x1="760" y1="190" x2="850" y2="190" stroke="#0ca678" stroke-width="3" marker-end="url(#arrow-green)"/>
<text class="" x="860" y="175" font-size="20" fill="#087f5b" text-anchor="start">药水（苦力怕的眼泪 + 糖）</text>
<line class="shape" x1="60" y1="300" x2="1150" y2="300" stroke="#dee2e6" stroke-width="2"/>
<text class="code" x="90" y="340" font-size="24" fill="#7c2d12" text-anchor="start">make_potion("糖", "苦力怕的眼泪")</text>
<rect class="shape" x="500" y="385" width="260" height="130" rx="12" fill="#495057" stroke="#212529" stroke-width="4"/>
<text class="" x="530" y="440" font-size="20" fill="#f8fafc" text-anchor="start">make_potion</text>
<rect class="shape" x="415" y="393" width="95" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text class="" x="428" y="401" font-size="18" fill="#0b4f7a" text-anchor="start">main</text>
<rect class="shape" x="415" y="455" width="95" height="36" rx="6" fill="#fff4cc" stroke="#f08c00" stroke-width="2"/>
<text class="" x="428" y="463" font-size="18" fill="#b35c00" text-anchor="start">extra</text>
<line class="shape" x1="200" y1="345" x2="420" y2="470" stroke="#e03131" stroke-width="3" marker-end="url(#arrow-red)"/>
<line class="shape" x1="260" y1="345" x2="420" y2="408" stroke="#e03131" stroke-width="3" marker-end="url(#arrow-red)"/>
