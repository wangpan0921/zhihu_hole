<text class="" x="860" y="420" font-size="20" fill="#087f5b" text-anchor="start">药水（糖 + 苦力怕的眼泪）</text>
<text class="" x="150" y="610" font-size="24" fill="#868e96" text-anchor="start">第一个投料口 ← 第一份材料；喂错顺序不会报错，只会给你错的成品。</text>
  </g>
</svg>
