<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7048e8"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", "Noto Sans CJK SC", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<rect width="1200" height="675" fill="#f4f6fb"/>
<rect class="shape" x="75" y="70" width="1050" height="535" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="75" y="70" width="1050" height="48" fill="#24292f" rx="8"/>
<text class="" x="105" y="82" font-size="24" fill="#ffffff" text-anchor="start">第 6 课：return vs print</text>
<rect class="shape" x="105" y="145" width="610" height="395" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<text class="" x="130" y="168" font-size="23" fill="#8b949e" text-anchor="start">代码</text>
<text class="code" x="130" y="215" font-size="25" fill="#e6edf3" text-anchor="start">def craft_A(material):</text>
<text class="code" x="130" y="249.5" font-size="25" fill="#e6edf3" text-anchor="start">&#160;&#160;&#160;&#160;print(material + "剑")</text>
<text class="code" x="130" y="284" font-size="25" fill="#e6edf3" text-anchor="start"></text>
<text class="code" x="130" y="318.5" font-size="25" fill="#e6edf3" text-anchor="start">def craft_B(material):</text>
<text class="code" x="130" y="353" font-size="25" fill="#e6edf3" text-anchor="start">&#160;&#160;&#160;&#160;return material + "剑"</text>
<text class="code" x="130" y="387.5" font-size="25" fill="#e6edf3" text-anchor="start"></text>
<text class="code" x="130" y="422" font-size="25" fill="#e6edf3" text-anchor="start">a = craft_A("铁")</text>
<text class="code" x="130" y="456.5" font-size="25" fill="#e6edf3" text-anchor="start">b = craft_B("铁")</text>
<rect class="shape" x="750" y="145" width="335" height="395" rx="6" fill="#111827" stroke="#374151" stroke-width="2"/>
<text class="" x="775" y="168" font-size="23" fill="#9ca3af" text-anchor="start">输出</text>
<text class="code" x="775" y="225" font-size="26" fill="#d1fae5" text-anchor="start">铁剑</text>
<text class="code" x="775" y="262.96" font-size="26" fill="#d1fae5" text-anchor="start">a 拿到了： None</text>
<text class="code" x="775" y="300.92" font-size="26" fill="#d1fae5" text-anchor="start">b 拿到了： 铁剑</text>
<rect class="shape" x="760" y="258" width="315" height="42" rx="8" fill="transparent" stroke="#ff6b6b" stroke-width="4"/>
<text class="" x="770" y="330" font-size="22" fill="#ffd8a8" text-anchor="start">😈 print 只是喊一嗓子，</text>
<text class="" x="770" y="360" font-size="22" fill="#ffd8a8" text-anchor="start">什么也没端出来！</text>
  </g>
</svg>
