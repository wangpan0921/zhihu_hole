<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", "Noto Sans CJK SC", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="140" y="40" font-size="38" fill="#111827" text-anchor="start">下标 = 从头跳几步（不是“第几个”）</text>
<path class="shape" d="M95 210 L60 200 L60 250 Z" fill="#f08c00" stroke="#f08c00" stroke-width="2"/>
<text class="" x="50" y="260" font-size="24" fill="#b35c00" text-anchor="start">起点</text>
<rect class="shape" x="130" y="195" width="145" height="90" rx="8" fill="#ffffff" stroke="#495057" stroke-width="4"/>
<text class="" x="170" y="220" font-size="27" fill="#111827" text-anchor="start">钻石</text>
<rect class="shape" x="152" y="300" width="101" height="44" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text class="" x="170" y="310" font-size="30" fill="#e03131" text-anchor="start">0</text>
<line class="shape" x1="95" y1="400" x2="202.5" y2="400" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="" x="118" y="370" font-size="22" fill="#1971c2" text-anchor="start">跨 0 步</text>
<rect class="shape" x="295" y="195" width="145" height="90" rx="8" fill="#ffffff" stroke="#495057" stroke-width="4"/>
<text class="" x="335" y="220" font-size="27" fill="#111827" text-anchor="start">金锭</text>
<rect class="shape" x="317" y="300" width="101" height="44" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text class="" x="335" y="310" font-size="30" fill="#e03131" text-anchor="start">1</text>
<line class="shape" x1="95" y1="400" x2="367.5" y2="400" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="" x="283" y="370" font-size="22" fill="#1971c2" text-anchor="start">跨 1 步</text>
<rect class="shape" x="460" y="195" width="145" height="90" rx="8" fill="#ffffff" stroke="#495057" stroke-width="4"/>
<text class="" x="500" y="220" font-size="27" fill="#111827" text-anchor="start">面包</text>
<rect class="shape" x="482" y="300" width="101" height="44" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text class="" x="500" y="310" font-size="30" fill="#e03131" text-anchor="start">2</text>
<line class="shape" x1="95" y1="400" x2="532.5" y2="400" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="" x="448" y="370" font-size="22" fill="#1971c2" text-anchor="start">跨 2 步</text>
<rect class="shape" x="625" y="195" width="145" height="90" rx="8" fill="#ffffff" stroke="#495057" stroke-width="4"/>
<text class="" x="665" y="220" font-size="27" fill="#111827" text-anchor="start">铁剑</text>
<rect class="shape" x="647" y="300" width="101" height="44" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text class="" x="665" y="310" font-size="30" fill="#e03131" text-anchor="start">3</text>
<line class="shape" x1="95" y1="400" x2="697.5" y2="400" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="" x="613" y="370" font-size="22" fill="#1971c2" text-anchor="start">跨 3 步</text>
<rect class="shape" x="790" y="195" width="145" height="90" rx="8" fill="#ffffff" stroke="#495057" stroke-width="4"/>
<text class="" x="830" y="220" font-size="27" fill="#111827" text-anchor="start">苹果</text>
<rect class="shape" x="812" y="300" width="101" height="44" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text class="" x="830" y="310" font-size="30" fill="#e03131" text-anchor="start">4</text>
<line class="shape" x1="95" y1="400" x2="862.5" y2="400" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text class="" x="778" y="370" font-size="22" fill="#1971c2" text-anchor="start">跨 4 步</text>
<text class="" x="180" y="470" font-size="30" fill="#0b4f7a" text-anchor="start">跳 0 步就在原地 → 所以第一格叫 [0]</text>
<rect class="shape" x="870" y="480" width="280" height="130" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
<text class="code" x="895" y="500" font-size="24" fill="#111827" text-anchor="start">bag[-1] = "苹果"</text>
<text class="" x="895" y="535" font-size="23" fill="#495057" text-anchor="start">（从右数第一个）</text>
<line class="shape" x1="950" y1="480" x2="950" y2="300" stroke="#f08c00" stroke-width="3" marker-end="url(#arrow-orange)"/>
<text class="" x="140" y="600" font-size="24" fill="#868e96" text-anchor="start">下标 0/1/2/3/4 分别是钻石/金锭/面包/铁剑/苹果要跨的步数</text>
  </g>
</svg>
