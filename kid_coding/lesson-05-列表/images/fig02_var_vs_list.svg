<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", "Noto Sans CJK SC", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
    .ex-canvas { filter: invert(93%) hue-rotate(180deg); }
  </style>
  <g class="ex-canvas">
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="" x="95" y="40" font-size="38" fill="#111827" text-anchor="start">5 个变量 vs 1 个列表：谁更省事？</text>
<line class="shape" x1="600" y1="115" x2="600" y2="555" stroke="#adb5bd" stroke-width="4"/>
<rect class="shape" x="70" y="130" width="460" height="400" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="4"/>
<text class="" x="215" y="155" font-size="30" fill="#495057" text-anchor="start">一个变量装一样</text>
<text class="code" x="105" y="210" font-size="24" fill="#111827" text-anchor="start">item1 = "钻石"</text>
<rect class="shape" x="400" y="205" width="90" height="40" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
<text class="" x="420" y="215" font-size="22" fill="#495057" text-anchor="start">钻石</text>
<text class="code" x="105" y="265" font-size="24" fill="#111827" text-anchor="start">item2 = "金锭"</text>
<rect class="shape" x="400" y="260" width="90" height="40" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
<text class="" x="420" y="270" font-size="22" fill="#495057" text-anchor="start">金锭</text>
<text class="code" x="105" y="320" font-size="24" fill="#111827" text-anchor="start">item3 = "面包"</text>
<rect class="shape" x="400" y="315" width="90" height="40" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
<text class="" x="420" y="325" font-size="22" fill="#495057" text-anchor="start">面包</text>
<text class="code" x="105" y="375" font-size="24" fill="#111827" text-anchor="start">item4 = "铁剑"</text>
<rect class="shape" x="400" y="370" width="90" height="40" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
<text class="" x="420" y="380" font-size="22" fill="#495057" text-anchor="start">铁剑</text>
<text class="code" x="105" y="430" font-size="24" fill="#111827" text-anchor="start">item5 = "苹果"</text>
<rect class="shape" x="400" y="425" width="90" height="40" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
<text class="" x="420" y="435" font-size="22" fill="#495057" text-anchor="start">苹果</text>
<text class="" x="115" y="480" font-size="30" fill="#e03131" text-anchor="start">❌ 东西一多就抓瞎</text>
<rect class="shape" x="660" y="130" width="470" height="400" rx="10" fill="#ebfbee" stroke="#0ca678" stroke-width="4"/>
<text class="" x="770" y="155" font-size="30" fill="#087f5b" text-anchor="start">一个列表装一整排</text>
<text class="code" x="700" y="215" font-size="23" fill="#111827" text-anchor="start">bag = ["钻石","金锭",</text>
<text class="code" x="730" y="245" font-size="23" fill="#111827" text-anchor="start">"面包","铁剑","苹果"]</text>
<rect class="shape" x="700" y="300" width="70" height="68" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="3"/>
<text class="" x="712" y="318" font-size="20" fill="#087f5b" text-anchor="start">钻石</text>
<text class="" x="722" y="350" font-size="24" fill="#e8590c" text-anchor="start">0</text>
<rect class="shape" x="778" y="300" width="70" height="68" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="3"/>
<text class="" x="790" y="318" font-size="20" fill="#087f5b" text-anchor="start">金锭</text>
<text class="" x="800" y="350" font-size="24" fill="#e8590c" text-anchor="start">1</text>
<rect class="shape" x="856" y="300" width="70" height="68" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="3"/>
<text class="" x="868" y="318" font-size="20" fill="#087f5b" text-anchor="start">面包</text>
<text class="" x="878" y="350" font-size="24" fill="#e8590c" text-anchor="start">2</text>
<rect class="shape" x="934" y="300" width="70" height="68" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="3"/>
<text class="" x="946" y="318" font-size="20" fill="#087f5b" text-anchor="start">铁剑</text>
<text class="" x="956" y="350" font-size="24" fill="#e8590c" text-anchor="start">3</text>
<rect class="shape" x="1012" y="300" width="70" height="68" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="3"/>
<text class="" x="1024" y="318" font-size="20" fill="#087f5b" text-anchor="start">苹果</text>
<text class="" x="1034" y="350" font-size="24" fill="#e8590c" text-anchor="start">4</text>
<text class="" x="700" y="395" font-size="26" fill="#087f5b" text-anchor="start">bag</text>
<line class="shape" x1="720" y1="425" x2="720" y2="400" stroke="#0ca678" stroke-width="3" marker-end="url(#arrow-green)"/>
<text class="" x="775" y="480" font-size="30" fill="#0ca678" text-anchor="start">✅ 一个变量全装下</text>
  </g>
</svg>
