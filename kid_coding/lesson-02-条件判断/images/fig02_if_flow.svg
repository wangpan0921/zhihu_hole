<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#e03131"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1971c2"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f08c00"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0ca678"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", sans-serif; dominant-baseline: hanging; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
  </style>
<text x="150" y="45" font-size="40" fill="#111827" text-anchor="start">if = 先看条件，成立才执行</text>
<polygon class="shape" points="380,130 505,205 380,280 255,205" fill="#fff4cc" stroke="#1e1e1e" stroke-width="3"/>
<text x="305" y="188" font-size="30" fill="#1e1e1e" text-anchor="start">踩在岩浆里？</text>
<line class="shape" x1="380" y1="282" x2="380" y2="385" stroke="#e03131" stroke-width="4" marker-end="url(#arrow-red)"/>
<text x="405" y="315" font-size="25" fill="#e03131" text-anchor="start">成立 True</text>
<rect class="shape" x="270" y="395" width="220" height="85" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="3"/>
<text x="322" y="418" font-size="30" fill="#7f1d1d" text-anchor="start">扣血 4 点</text>
<line class="shape" x1="505" y1="205" x2="695" y2="205" stroke="#1971c2" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="535" y="158" font-size="25" fill="#1971c2" text-anchor="start">不成立 False</text>
<rect class="shape" x="710" y="165" width="220" height="85" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
<text x="745" y="188" font-size="30" fill="#0b4f7a" text-anchor="start">什么都不做</text>
</svg>
