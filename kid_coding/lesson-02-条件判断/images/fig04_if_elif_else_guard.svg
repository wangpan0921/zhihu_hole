<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#e03131"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1971c2"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f08c00"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0ca678"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", sans-serif; dominant-baseline: hanging; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
  </style>
<text x="120" y="45" font-size="38" fill="#111827" text-anchor="start">if / elif / else：从上往下检查</text>
<line class="shape" x1="95" y1="135" x2="95" y2="530" stroke="#495057" stroke-width="5" marker-end="url(#arrow-black)"/>
<text x="125" y="250" font-size="28" fill="#495057" text-anchor="start">谁先成立就放谁过，后面不看</text>
<polyline class="shape" points="438,160 600,115 762,160" fill="none" stroke="#e03131" stroke-width="4"/>
<rect class="shape" x="420" y="160" width="360" height="95" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="4"/>
<text x="455" y="180" font-size="30" fill="#1e1e1e" text-anchor="start">if  hp &lt;= 0</text>
<text x="655" y="219" font-size="30" fill="#e03131" text-anchor="start">→ 你死了</text>
<circle class="shape" cx="841" cy="213" r="22" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
<rect class="shape" x="806" y="238" width="70" height="58" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
<polyline class="shape" points="438,310 600,265 762,310" fill="none" stroke="#f08c00" stroke-width="4"/>
<rect class="shape" x="420" y="310" width="360" height="95" rx="10" fill="#fff4cc" stroke="#f08c00" stroke-width="4"/>
<text x="455" y="330" font-size="30" fill="#1e1e1e" text-anchor="start">elif hp &lt; 6</text>
<text x="655" y="369" font-size="30" fill="#f08c00" text-anchor="start">→ 危险</text>
<circle class="shape" cx="841" cy="363" r="22" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
<rect class="shape" x="806" y="388" width="70" height="58" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
<polyline class="shape" points="438,460 600,415 762,460" fill="none" stroke="#0ca678" stroke-width="4"/>
<rect class="shape" x="420" y="460" width="360" height="95" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="4"/>
<text x="455" y="480" font-size="30" fill="#1e1e1e" text-anchor="start">else</text>
<text x="655" y="519" font-size="30" fill="#0ca678" text-anchor="start">→ 状态良好</text>
<circle class="shape" cx="841" cy="513" r="22" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
<rect class="shape" x="806" y="538" width="70" height="58" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
</svg>
