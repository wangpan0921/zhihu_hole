<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", "Noto Sans CJK SC", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
  </style>
<text class="" x="230" y="42" font-size="40" fill="#111827" text-anchor="start">死循环 = 电脑陷在原地打转</text>
<path class="shape" d="M410 320 C410 205 565 175 655 240 C740 300 710 435 590 470 C465 500 360 425 395 320" fill="none" stroke="#e03131" stroke-width="18" stroke-linecap="round"/>
<path d="M390 315 L345 360 L425 375 Z" fill="#e03131"/>
<text class="code" x="492" y="300" font-size="34" fill="#7f1d1d" text-anchor="start">zombies = 0</text>
<text class="" x="515" y="345" font-size="30" fill="#e03131" text-anchor="start">永远不变</text>
<rect class="shape" x="75" y="190" width="300" height="105" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="4"/>
<text class="code" x="105" y="215" font-size="25" fill="#111827" text-anchor="start">while zombies &lt; 3:</text>
<text class="code" x="105" y="250" font-size="22" fill="#111827" text-anchor="start">print("刷出第 0 只僵尸")</text>
<line class="shape" x1="375" y1="245" x2="455" y2="275" stroke="#e03131" stroke-width="4" marker-end="url(#arrow-red)"/>
<text class="" x="805" y="230" font-size="58" fill="#111827" text-anchor="start">😱</text>
<rect class="shape" x="880" y="225" width="230" height="95" rx="10" fill="#ffffff" stroke="#e03131" stroke-width="4"/>
<text class="" x="915" y="252" font-size="31" fill="#e03131" text-anchor="start">停不下来了！</text>
<rect class="shape" x="170" y="550" width="680" height="62" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="4"/>
<text class="" x="205" y="566" font-size="27" fill="#7f1d1d" text-anchor="start">❗ 找不到一行“让条件靠近不成立” → 死循环</text>
<rect class="shape" x="900" y="548" width="160" height="64" rx="10" fill="#e03131" stroke="#7f1d1d" stroke-width="4"/>
<text class="" x="924" y="566" font-size="25" fill="#ffffff" text-anchor="start">Ctrl+C 强停</text>
</svg>
