    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", "Noto Sans CJK SC", sans-serif; dominant-baseline: hanging; letter-spacing: 0; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
  </style>
<rect width="900" height="1200" fill="#f8fafc"/>
<rect x="0" y="0" width="900" height="170" fill="#1f2937"/>
<text class="" x="70" y="48" font-size="44" fill="#ffd8a8" text-anchor="start">第 4 课</text>
<text class="" x="70" y="98" font-size="52" fill="#ffffff" text-anchor="start">今天你学会了</text>
<rect class="shape" x="70" y="235" width="760" height="90" rx="12" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text class="" x="105" y="260" font-size="30" fill="#111827" text-anchor="start">🔁 while：条件成立就一直做</text>
<rect class="shape" x="70" y="360" width="760" height="90" rx="12" fill="#ffffff" stroke="#f08c00" stroke-width="3"/>
<text class="" x="105" y="385" font-size="30" fill="#111827" text-anchor="start">🧰 三要素：初值 / 条件 / 更新</text>
<rect class="shape" x="70" y="485" width="760" height="90" rx="12" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text class="" x="105" y="510" font-size="30" fill="#111827" text-anchor="start">♾️ 死循环：忘更新就完蛋</text>
<rect class="shape" x="70" y="610" width="760" height="90" rx="12" fill="#ffffff" stroke="#f08c00" stroke-width="3"/>
<text class="" x="105" y="635" font-size="30" fill="#111827" text-anchor="start">⚖️ 边界坑：&lt; 和 &lt;= 差一次</text>
<rect class="shape" x="70" y="735" width="760" height="90" rx="12" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text class="" x="105" y="760" font-size="30" fill="#111827" text-anchor="start">🆚 for vs while：知次数 vs 知停条件</text>
<rect class="shape" x="70" y="860" width="760" height="90" rx="12" fill="#ffffff" stroke="#f08c00" stroke-width="3"/>
<text class="" x="105" y="885" font-size="30" fill="#111827" text-anchor="start">⛔ break：可以提前跳出</text>
