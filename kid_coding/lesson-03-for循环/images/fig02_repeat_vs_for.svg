<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", sans-serif; dominant-baseline: hanging; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
    
  </style>
<text class="" x="360" y="42" font-size="40" fill="#111827" text-anchor="start">重复的事，交给 for</text>
<rect class="shape" x="75" y="135" width="430" height="350" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="4"/>
<text class="code" x="105" y="175" font-size="25" fill="#111827" text-anchor="start">print("第1只僵尸出现了")</text>
<text class="code" x="105" y="211.25" font-size="25" fill="#111827" text-anchor="start">print("第2只僵尸出现了")</text>
<text class="code" x="105" y="247.5" font-size="25" fill="#111827" text-anchor="start">print("第3只僵尸出现了")</text>
<text class="code" x="105" y="283.75" font-size="25" fill="#111827" text-anchor="start">print("第4只僵尸出现了")</text>
<text class="code" x="105" y="320" font-size="25" fill="#111827" text-anchor="start">print("第5只僵尸出现了")</text>
<text class="" x="115" y="430" font-size="29" fill="#e03131" text-anchor="start">累、易错、100 只怎么办</text>
<line class="shape" x1="535" y1="310" x2="665" y2="310" stroke="#495057" stroke-width="8" marker-end="url(#arrow-black)"/>
<rect class="shape" x="700" y="185" width="420" height="250" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="4"/>
<text class="code" x="735" y="235" font-size="27" fill="#111827" text-anchor="start">for i in range(5):</text>
<text class="code" x="735" y="276.85" font-size="27" fill="#111827" text-anchor="start">    print("第", i + 1, "只僵尸出现了")</text>
<text class="" x="745" y="365" font-size="28" fill="#0ca678" text-anchor="start">一句话搞定，改 5→100 即可</text>
</svg>
