<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.15"/>
    </filter>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1e1e1e"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e03131"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0ca678"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1971c2"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: "Comic Sans MS", "DejaVu Sans", sans-serif; dominant-baseline: hanging; }
    .shape { filter: url(#wobble); stroke-linejoin: round; stroke-linecap: round; }
    .code { font-family: "DejaVu Sans Mono", "Consolas", monospace; }
    
  </style>
<text class="" x="350" y="42" font-size="40" fill="#111827" text-anchor="start">for 循环执行流程</text>
<rect class="shape" x="110" y="160" width="230" height="78" rx="10" fill="#eef6ff" stroke="#1971c2" stroke-width="4"/>
<text class="" x="145" y="183" font-size="30" fill="#0b4f7a" text-anchor="start">i 取下一个值</text>
<polygon class="shape" points="500,130 650,205 500,280 350,205" fill="#fff4cc" stroke="#f08c00" stroke-width="4"/>
<text class="" x="445" y="188" font-size="30" fill="#1e1e1e" text-anchor="start">还有值吗？</text>
<rect class="shape" x="765" y="160" width="250" height="78" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="4"/>
<text class="" x="790" y="183" font-size="29" fill="#087f5b" text-anchor="start">执行缩进里的代码</text>
<rect class="shape" x="455" y="390" width="150" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="3"/>
<text class="" x="500" y="410" font-size="30" fill="#1e1e1e" text-anchor="start">结束</text>
<line class="shape" x1="340" y1="200" x2="350" y2="200" stroke="#1971c2" stroke-width="4" marker-end="url(#arrow-blue)"/>
<line class="shape" x1="650" y1="205" x2="765" y2="205" stroke="#0ca678" stroke-width="4" marker-end="url(#arrow-green)"/>
<text class="" x="675" y="165" font-size="26" fill="#0ca678" text-anchor="start">有</text>
<line class="shape" x1="890" y1="240" x2="240" y2="240" stroke="#0ca678" stroke-width="4" marker-end="url(#arrow-green)"/>
<line class="shape" x1="890" y1="240" x2="890" y2="320" stroke="#0ca678" stroke-width="4"/>
<line class="shape" x1="240" y1="320" x2="240" y2="240" stroke="#0ca678" stroke-width="4"/>
<line class="shape" x1="500" y1="280" x2="500" y2="390" stroke="#495057" stroke-width="4" marker-end="url(#arrow-black)"/>
<text class="" x="525" y="320" font-size="26" fill="#495057" text-anchor="start">没有</text>
<text class="" x="110" y="520" font-size="28" fill="#111827" text-anchor="start">range(3) 三轮：i=0 打印第1只；i=1 打印第2只；i=2 打印第3只</text>
</svg>
