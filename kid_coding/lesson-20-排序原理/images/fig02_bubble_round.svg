<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#263238"/></marker><style>.scene{filter:invert(93%) hue-rotate(180deg);}text{font-family:'Noto Sans CJK SC','Microsoft YaHei','Noto Sans',sans-serif;letter-spacing:0;fill:#263238}.title{font-size:36px;font-weight:700}.h2{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#5f6b76}.mono{font-family:'Noto Sans Mono CJK SC','Noto Sans Mono','DejaVu Sans Mono',monospace}</style></defs><g class="scene"><rect width="1200" height="675" fill="#fff"/><text x="600" y="48" class="title" text-anchor="middle" xml:space="preserve" >冒泡排序的一轮：最大的数冒到最右边</text><text x="600" y="84" class="body" text-anchor="middle" xml:space="preserve" >从左往右比较相邻两格</text><rect x="85" y="125" width="280" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="3" /><text x="225" y="165" class="h2 mono" text-anchor="middle" xml:space="preserve" >7 | 2 | 9 | 4</text><path d="M420 155 C637 155,823 155,1040 155" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/><text x="600" y="147" class="body" text-anchor="middle" xml:space="preserve" style="fill:#dc2626;font-weight:700">7 和 2：交换</text><rect x="85" y="237" width="280" height="62" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="3" /><text x="225" y="277" class="h2 mono" text-anchor="middle" xml:space="preserve" >2 | 7 | 9 | 4</text><path d="M420 267 C637 267,823 267,1040 267" fill="none" stroke="#5f6b76" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/><text x="600" y="259" class="body" text-anchor="middle" xml:space="preserve" style="fill:#5f6b76;font-weight:700">7 和 9：不换</text><rect x="85" y="349" width="280" height="62" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="3" /><text x="225" y="389" class="h2 mono" text-anchor="middle" xml:space