or i in range(len(loot) - 1):</text><text x="58" y="225" class="small mono" text-anchor="start" xml:space="preserve" style="fill:#84919c">3</text><text x="98" y="225" class="small mono" text-anchor="start" xml:space="preserve" style="font-size:17px;fill:#2563eb">    for j in range(len(loot) - 1 - i):</text><text x="58" y="265" class="small mono" text-anchor="start" xml:space="preserve" style="fill:#84919c">4</text><text x="98" y="265" class="small mono" text-anchor="start" xml:space="preserve" style="font-size:17px;fill:#2563eb">        if loot[j] &gt; loot[j + 1]:</text><text x="58" y="305" class="small mono" text-anchor="start" xml:space="preserve" style="fill:#84919c">5</text><text x="98" y="305" class="small mono" text-anchor="start" xml:space="preserve" style="font-size:17px;fill:#263238">            loot[j], loot[j + 1] = loot[j + 1], loot[j]</text><text x="58" y="345" class="small mono" text-anchor="start" xml:space="preserve" style="fill:#84919c">6</text><text x="98" y="345" class="small mono" text-anchor="start" xml:space="preserve" style="font-size:17px;fill:#16a34a">print(&quot;从小到大：&quot;, loot)</text><text x="840" y="190" class="body mono" text-anchor="start" xml:space="preserve" >从小到大： [2, 4, 7, 9]</text><rect x="833" y="510" width="310" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="988" y="542" class="small mono" text-anchor="middle" xml:space="preserve" >Process finished · exit code 0</text><text x="1176" y="657" class="small" text-anchor="end" xml:space="preserve" style="font-size:16px;fill:#52606b">公众号：icey66wang</text></g></svg>