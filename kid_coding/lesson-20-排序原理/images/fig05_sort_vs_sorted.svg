<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#263238"/></marker><style>.scene{filter:invert(93%) hue-rotate(180deg);}text{font-family:'Noto Sans CJK SC','Microsoft YaHei','Noto Sans',sans-serif;letter-spacing:0;fill:#263238}.title{font-size:36px;font-weight:700}.h2{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#5f6b76}.mono{font-family:'Noto Sans Mono CJK SC','Noto Sans Mono','DejaVu Sans Mono',monospace}</style></defs><g class="scene"><rect width="1200" height="675" fill="#fff"/><text x="600" y="48" class="title" text-anchor="middle" xml:space="preserve" >sort() 与 sorted()：原地改，还是复制改？</text><rect x="45" y="92" width="520" height="470" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3" /><rect x="635" y="92" width="520" height="470" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" /><line x1="600" y1="100" x2="600" y2="550" stroke="#5f6b76" stroke-width="4" /><text x="305" y="135" class="h2" text-anchor="middle" xml:space="preserve" >sort() —— 原地修改</text><text x="895" y="135" class="h2" text-anchor="middle" xml:space="preserve" >sorted() —— 返回新列表</text><rect x="100" y="205" width="410" height="72" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2" /><text x="305" y="250" class="body mono" text-anchor="middle" xml:space="preserve" >loot = [7, 2, 9, 4]</text><path d="M305 300 C305 300,305 365,305 365" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="150" y="395" width="310" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3" /><text x="305" y="438" class="h2 mono" text-anchor="middle" xml:space="preserve" >[2, 4, 7, 9]</text><text x="305" y="505" class="body" text-anchor="middle" xml:space="preserve" >原背包被直接重排</text><rect x="690" y="205" width="410" height="72" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2" /><text x="895" y="250" class="body mono" text-anchor="middle" xml:space="preserve" >new_loot = sorted(loot)</text><rect x="695" y="330" width="170" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" /><text x="780" y="373" class="body mono" text-anchor="middle" xml:space="preserve" >原 loot</text><path d="M865 365 C886 365,904 365,925 365" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="955" y="330" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3" /><text x="1030" y="373" class="body mono" text-anchor="middle" xml:space="preserve" >新列表</text><text x="1030" y="435" class="small mono" text-anchor="middle" xml:space="preserve" >[2,4,7,9]</text><text x="780" y="465" class="body mono" text-anchor="middle" xml:space="preserve" >[7,2,9,4] 保持不变</text><rect x="165" y="570" width="870" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="600" y="598" class="body" text-anchor="middle" xml:space="preserve" >要不要保留原列表？保留就用 sorted()。</text><text x="1176" y="657" class="small" text-anchor="end" xml:space="preserve" style="font-size:16px;fill:#52606b">公众号：icey66wang</text></g></svg>