<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#263238"/></marker><style>.scene{filter:invert(93%) hue-rotate(180deg);}text{font-family:'Noto Sans CJK SC','Microsoft YaHei','Noto Sans',sans-serif;letter-spacing:0;fill:#263238}.title{font-size:36px;font-weight:700}.h2{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#5f6b76}.mono{font-family:'Noto Sans Mono CJK SC','Noto Sans Mono','DejaVu Sans Mono',monospace}</style></defs><g class="scene"><rect width="900" height="1200" fill="#fff"/><rect x="0" y="0" width="900" height="1200" rx="0" fill="#f4f7f9" stroke="none" stroke-width="0" /><rect x="42" y="38" width="816" height="174" rx="8" fill="#e8f2ff" stroke="#2563eb" stroke-width="3" /><text x="74" y="88" class="h2" text-anchor="start" xml:space="preserve" >第 20 课 · 知识清单</text><text x="74" y="146" class="title" text-anchor="start" xml:space="preserve" style="font-size:46px">今天你学会了</text><text x="75" y="185" class="body" text-anchor="start" xml:space="preserve" >《我的世界里学编程》</text><rect x="545" y="68" width="270" height="56" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="680" y="104" class="small" text-anchor="middle" xml:space="preserve" style="font-weight:700">第三阶段 · 算法关</text><rect x="58" y="244" width="784" height="108" rx="7" fill="#fff" stroke="#8b98a5" stroke-width="2" /><text x="112" y="309" class="body" text-anchor="middle" xml:space="preserve" style="font-size:28px">↕</text><text x="168" y="286" class="h2" text-anchor="start" xml:space="preserve" >排序</text><text x="168" y="322" class="body" text-anchor="start" xml:space="preserve" >按规则重新排队：升序小到大，降序大到小</text><rect x="58" y="376" width="784" height="108" rx="7" fill="#fff" stroke="#8b98a5" stroke-width="2" /><text x="112" y="441" class="body" text-anchor="middle" xml:space="preserve" style="font-size:28px">○</text><text x="168" y="418" class="h2" text-anchor="start" xml:space="preserve" >冒泡排序</text><text x="168" y="454" class="body" text-anchor="start" xml:space="preserve" >比较邻居，较大值逐轮冒到右边</text><rect x="58" y="508" width="784" height="108" rx="7" fill="#fff" stroke="#8b98a5" stroke-width="2" /><text x="112" y="573" class="body" text-anchor="middle" xml:space="preserve" style="font-size:28px">★</text><text x="168" y="550" class="h2" text-anchor="start" xml:space="preserve" >选择排序</text><text x="168" y="586" class="body" text-anchor="start" xml:space="preserve" >每轮挑出剩余元素里的最小值</text><rect x="58" y="640" width="784" height="108" rx="7" fill="#fff" stroke="#8b98a5" stroke-width="2" /><text x="112" y="705" class="body" text-anchor="middle" xml:space="preserve" style="font-size:28px">⇄</text><text x="168" y="682" class="h2" text-anchor="start" xml:space="preserve" >交换</text><text x="168" y="718" class="body" text-anchor="start" xml:space="preserve" >多重赋值一行交换两个位置</text><rect x="58" y="772" width="784" height="108" rx="7" fill="#fff" stroke="#8b98a5" stroke-width="2" /><text x="112" y="837" class="body" text-anchor="middle" xml:space="preserve" style="font-size:28px">▣</text><text x="168" y="814" class="h2" text-anchor="start" xml:space="preserve" >sort()</text><text x="168" y="850" class="body" text-anchor="start" xml:space="preserve" >修改原列表；sorted() 返回新列表</text><rect x="58" y="904" width="784" height="108" rx="7" fill="#fff" stroke="#8b98a5" stroke-width="2" /><text x="112" y="969" class="body" text-anchor="middle" xml:space="preserve" style="font-size:28px">⌘</text><text x="168" y="946" class="h2" text-anchor="start" xml:space="preserve" >嵌套循环</text><text x="168" y="982" class="body" text-anchor="start" xml:space="preserve" >外层管轮次，内层做逐格比较</text><rect x="42" y="1055" width="816" height="105" rx="7" fill="#263238" stroke="#263238" stroke-width="0" /><text x="75" y="1101" class="small" text-anchor="start" xml:space="preserve" style="fill:#bdd7e5;font-weight:700">一句话总结</text><text x="75" y="1139" class="body" text-anchor="start" xml:space="preserve" style="fill:#fff;font-weight:700">先手写看懂排序，再用工具处理大量数据。</text><text x="876" y="1182" class="small" text-anchor="end" xml:space="preserve" style="font-size:16px;fill:#52606b">公众号：icey66wang</text></g></svg>